{% extends "base.html" %}
{% block title %}Удалить проект — MeetService{% endblock %}
{% block content %}
<section class="container auth-page">
  <div class="auth-card">
    <p class="eyebrow">опасное действие</p>
    <h1>Удалить проект?</h1>
    <p class="lead">
      Ты собираешься удалить проект <strong>{{ project.title }}</strong>.
      Это действие нельзя отменить.
    </p>
    <form method="post" class="form-grid">
      {% csrf_token %}
      <button class="btn btn-primary full-width" type="submit">Да, удалить проект</button>
      <a class="btn btn-secondary full-width" href="{% url 'projects:my_projects' %}">Отмена</a>
    </form>
  </div>
</section>
{% endblock %}
