{% load i18n %}
{% if technologies %}
    <div class="tag-cloud">
        {% for technology in technologies %}
            <span class="tag">
                {{ technology.name }}
                <small>{{ technology.project_count }}</small>
            </span>
        {% endfor %}
    </div>
{% else %}
    <p class="empty">{% trans "Технологии пока не добавлены." %}</p>
{% endif %}
