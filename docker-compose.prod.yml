services:
  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    working_dir: /app/meetService
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,0.0.0.0}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-sqlite:////app/data/db.sqlite3}

      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-New-Makers <noreply@example.com>}

      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-True}
      SITE_URL: ${SITE_URL:-http://127.0.0.1:8000}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://meetservice:meetservice@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CACHE_URL: ${CACHE_URL:-redis://redis:6379/1}
      INVITATION_EXPIRE_DAYS: ${INVITATION_EXPIRE_DAYS:-14}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DJANGO_SILK_ENABLED: ${DJANGO_SILK_ENABLED:-False}
      DJANGO_SERVE_MEDIA: ${DJANGO_SERVE_MEDIA:-True}
    volumes:
      - sqlite_data:/app/data
      - ./meetService/media:/app/meetService/media
      - static_data:/app/meetService/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    working_dir: /app/meetService
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,0.0.0.0}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-sqlite:////app/data/db.sqlite3}

      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-New-Makers <noreply@example.com>}

      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-True}
      SITE_URL: ${SITE_URL:-http://127.0.0.1:8000}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://meetservice:meetservice@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      INVITATION_EXPIRE_DAYS: ${INVITATION_EXPIRE_DAYS:-14}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DJANGO_SILK_ENABLED: ${DJANGO_SILK_ENABLED:-False}
    volumes:
      - sqlite_data:/app/data
      - ./meetService/media:/app/meetService/media
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  celery_beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    working_dir: /app/meetService
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-docker-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,0.0.0.0}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-sqlite:////app/data/db.sqlite3}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://meetservice:meetservice@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-True}
      SITE_URL: ${SITE_URL:-http://127.0.0.1:8000}
      INVITATION_EXPIRE_DAYS: ${INVITATION_EXPIRE_DAYS:-14}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DJANGO_SILK_ENABLED: ${DJANGO_SILK_ENABLED:-False}
    volumes:
      - sqlite_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-meetservice}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-meetservice}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  rabbitmq_data:
  sqlite_data:
  static_data:
